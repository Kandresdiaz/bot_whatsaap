name: 🚀 Deploy a Wispbyte + Actualizar Documentación

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ── JOB 1: Reiniciar el backend en Wispbyte si cambió backend/ ──────────────
  # Al arrancar, el comando de inicio del servidor descarga el código nuevo de
  # GitHub (ver "Startup" en el panel de Wispbyte), así que basta con reiniciarlo.
  deploy-wispbyte:
    name: Redeploy Backend (Wispbyte)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reiniciar servidor
        env:
          PANEL_URL: ${{ secrets.WISPBYTE_PANEL_URL }}
          API_KEY: ${{ secrets.WISPBYTE_API_KEY }}
          SERVER_ID: ${{ secrets.WISPBYTE_SERVER_ID }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ -n "$BEFORE" ] \
             && git cat-file -e "$BEFORE" 2>/dev/null \
             && ! git diff --name-only "$BEFORE" "${{ github.sha }}" | grep -q '^backend/'; then
            echo "Sin cambios en backend/: no se reinicia el servidor."
            exit 0
          fi
          if [ -z "$PANEL_URL" ] || [ -z "$API_KEY" ] || [ -z "$SERVER_ID" ]; then
            echo "⚠️  Faltan los secrets WISPBYTE_PANEL_URL, WISPBYTE_API_KEY o WISPBYTE_SERVER_ID."
            echo "   GitHub → Settings → Secrets and variables → Actions → New repository secret"
            exit 0
          fi
          status=$(curl -s -o /tmp/resp.txt -w "%{http_code}" -X POST \
            "${PANEL_URL%/}/api/client/servers/${SERVER_ID}/power" \
            -H "Authorization: Bearer ${API_KEY}" \
            -H "Accept: application/json" -H "Content-Type: application/json" \
            -d '{"signal":"restart"}')
          if [ "$status" != "204" ]; then
            echo "❌ Wispbyte respondió HTTP $status"; cat /tmp/resp.txt; exit 1
          fi
          echo "✅ Reinicio enviado: el servidor descarga el código nuevo al arrancar (~1 min)."

  # ── JOB 2: Actualizar SKILL.md automáticamente ─────────────────────────────
  update-docs:
    name: Actualizar Documentación del Proyecto
    runs-on: ubuntu-latest
    needs: deploy-wispbyte
    permissions:
      contents: write
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generar fecha y commit info
        id: info
        run: |
          echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          echo "COMMIT_MSG=$(git log -1 --pretty='%s')" >> $GITHUB_OUTPUT
          echo "COMMIT_SHA=$(git log -1 --pretty='%h')" >> $GITHUB_OUTPUT
          echo "AUTHOR=$(git log -1 --pretty='%an')" >> $GITHUB_OUTPUT

      - name: Actualizar tabla de cambios en SKILL.md
        run: |
          SKILL_FILE=".agents/skills/botwaa/SKILL.md"
          DATE="${{ steps.info.outputs.DATE }}"
          MSG="${{ steps.info.outputs.COMMIT_MSG }}"
          SHA="${{ steps.info.outputs.COMMIT_SHA }}"

          # Agregar nueva fila a la tabla de actualizaciones
          NEW_ROW="| **${DATE}** | **${MSG}** (\`${SHA}\`) | Auto-deployed |"

          # Insertar antes de la línea "---" final de la tabla de actualizaciones
          sed -i "/^| 2026-07/!b;/Actualizaciones importantes/!b;n" "$SKILL_FILE" || true

          # Append al final de la sección de actualizaciones usando Python (más confiable)
          python3 << 'EOF'
          import re, os

          skill_path = ".agents/skills/botwaa/SKILL.md"
          date = os.environ.get("DATE", "")
          msg = os.environ.get("MSG", "")
          sha = os.environ.get("SHA", "")

          with open(skill_path, "r", encoding="utf-8") as f:
              content = f.read()

          # Nueva fila para la tabla
          new_row = f"| **{date}** | {msg} (`{sha}`) | Auto-deploy |\n"

          # Insertar antes de la sección "## Próximas mejoras"
          content = content.replace(
              "## Próximas mejoras sugeridas",
              new_row + "\n## Próximas mejoras sugeridas"
          )

          with open(skill_path, "w", encoding="utf-8") as f:
              f.write(content)

          print(f"✅ Documentación actualizada con: {date} - {msg}")
          EOF
        env:
          DATE: ${{ steps.info.outputs.DATE }}
          MSG: ${{ steps.info.outputs.COMMIT_MSG }}
          SHA: ${{ steps.info.outputs.COMMIT_SHA }}

      - name: Commit actualización de documentación
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "BotWA Docs Bot"
          git add .agents/skills/botwaa/SKILL.md
          git diff --staged --quiet || git commit -m "docs: auto-actualización SKILL.md [${{ steps.info.outputs.DATE }}]"
          git push || echo "Sin cambios para pushear"
